<script src="../intro/lib.js"></script><script src="words.js"></script><script src="media.js"></script>

<script>const CH = +(new URLSearchParams(location.search).get('ch') || 2); document.write(`<script src="chapters/ch${String(CH).padStart(2, '0')}.js"><\/script>`);</script>
<script>
const out = (() => { const c = document.getElementById('cv'); c.width = W; c.height = H; return c.getContext('2d'); })();
const ACC = mk(W, H), actx = ACC.getContext('2d');
const BG = mk(W, H), bgx = BG.getContext('2d'), HALF = mk(W / 2, H / 2), hx = HALF.getContext('2d');
const POST = mk(W, H), px = POST.getContext('2d');
let WOODPAT, DUST = [];

function worldTransform(g, c) { g.setTransform(1, 0, 0, 1, 0, 0); g.translate(W / 2, H / 2); g.rotate(c.r); g.scale(c.z, c.z); g.translate(-c.x, -c.y); }
function viewRect(c) { const R = Math.hypot(W, H) / 2 / c.z; return [c.x - R, c.y - R, c.x + R, c.y + R]; }

function drawDesk(g, c) {
  const [x0, y0, x1, y1] = viewRect(c);
  g.fillStyle = WOODPAT; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  g.save(); g.globalCompositeOperation = 'screen';
  for (const l of LAMPS) {
    if (l.x + l.r < x0 || l.x - l.r > x1 || l.y + l.r < y0 || l.y - l.r > y1) continue;
    const gr = g.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); gr.addColorStop(0, `rgba(150,105,60,${.42 * l.k})`); gr.addColorStop(.5, `rgba(110,75,40,${.16 * l.k})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  g.restore();
}
function visibleItems(t, c) {
  const [x0, y0, x1, y1] = viewRect(c), res = [];
  for (const it of ITEMS) {
    const st = it.state(t); if (!st || st.a <= 0) continue;
    const R = Math.max(it.w, it.h) * .75 * st.s * (1 + st.L * .6) + 200 + st.L * 400;
    if (st.x + R < x0 || st.x - R > x1 || st.y + R < y0 || st.y - R > y1) continue;
    res.push([it, st]);
  }
  res.sort((a, b) => (a[1].L > .05) - (b[1].L > .05) || a[0].order - b[0].order);
  return res;
}
function drawItem(g, it, st, t, c) {
  const L = st.L, k = 1 + L * .45, px_ = st.x + (st.x - c.x) * L * .18, py_ = st.y + (st.y - c.y) * L * .18;
  if (it.shadow) {
    g.save(); g.translate(st.x + 14 + L * 95, st.y + 18 + L * 125); g.rotate(st.r); const s = st.s * (1 + L * .12); g.scale(s, s);
    g.globalAlpha = st.a * clamp(.6 - L * .28) * it.shadow; const sx = it.w / 160, sy = it.h / 160; g.drawImage(SHADOW, -it.w / 2 - 48 * sx, -it.h / 2 - 48 * sy, 256 * sx, 256 * sy); g.restore();
  }
  g.save(); g.translate(px_, py_); g.rotate(st.r); g.scale(st.s * k, st.s * k); g.globalAlpha = st.a;
  it.draw(g, t, it, st);
  if (it.lit) { const b = lightAt(st.x, st.y) + L * .25; if (b < .99) { g.globalAlpha = st.a * clamp(1 - b) * .7; g.fillStyle = '#000'; g.fillRect(-it.w / 2, -it.h / 2, it.w, it.h); } }
  g.restore();
}
function drawFG(g, t, c) {
  // dust motes and out-of-focus props, each with its own parallax depth
  g.setTransform(1, 0, 0, 1, 0, 0);
  const place = (x, y, p) => { const dx = (x - c.x) * c.z * p, dy = (y - c.y) * c.z * p, cr = Math.cos(c.r), sr = Math.sin(c.r); return [W / 2 + dx * cr - dy * sr, H / 2 + dx * sr + dy * cr]; };
  for (const d of DUST) {
    const [sx, sy] = place(d.x + Math.sin(t * d.v + d.ph) * 40, d.y - t * 6, d.p); const r = d.r * c.z * d.p;
    if (sx < -r || sx > W + r || sy < -r || sy > H + r) continue; g.globalAlpha = clamp((c.z - .45) / .35) * d.a * (.6 + .4 * Math.sin(t * 1.3 + d.ph)); g.drawImage(DUSTSP, sx - r, sy - r, r * 2, r * 2);
  }
  for (const f of FG) {
    const spr = PROPS[f.spr], [sx, sy] = place(f.x, f.y, f.p), s = f.s * c.z * f.p, w = spr.width * s, h = spr.height * s;
    if (sx + w < 0 || sx - w > W || sy + h < 0 || sy - h > H) continue;
    const fz = clamp((c.z - .45) / .35); if (fz <= 0) continue;
    g.save(); g.translate(sx, sy); g.rotate(c.r + f.rot); g.globalAlpha = f.a * fz; g.drawImage(spr, -w / 2, -h / 2, w, h); g.restore();
  }
  g.globalAlpha = 1;
  for (const tp of TAPES) {
    const p = prog(t, tp.t0, tp.t0 + tp.dur), q = tp.out ? ein(prog(t, tp.out, tp.out + .35)) : 0; if (p <= 0 || q >= 1) continue;
    const e = eout(p) - q * 1.2, sway = Math.sin((t - tp.t0) * 2.2) * 6;
    g.save(); g.translate(W / 2 + tp.dir * (1 - e) * 2600, H / 2 + tp.y + sway); g.rotate(tp.ang + c.r * .5);
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 40; g.shadowOffsetY = 30; g.fillStyle = '#d8b13a'; g.fillRect(-1700, -62, 3400, 124); g.shadowColor = 'transparent';
    g.fillStyle = '#16120e'; for (let x = -1700; x < 1700; x += 120) { g.beginPath(); g.moveTo(x, -62); g.lineTo(x + 50, -62); g.lineTo(x + 10, -44); g.lineTo(x - 40, -44); g.fill(); g.beginPath(); g.moveTo(x, 62); g.lineTo(x + 50, 62); g.lineTo(x + 10, 44); g.lineTo(x - 40, 44); g.fill(); }
    g.font = `800 54px ${SANS}`; g.letterSpacing = '8px'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#16120e';
    const txt = typeof TAPE_TEXT !== 'undefined' ? TAPE_TEXT : 'СПОЙЛЕРЫ · ВСЕ 6 СЕЗОНОВ · '; const tw = g.measureText(txt).width; for (let x = -1700 - (t * 60 % tw); x < 1700; x += tw) { g.textAlign = 'left'; g.fillText(txt, x, 4); }
    g.letterSpacing = '0px'; g.restore();
  }
}
function drawWorld(g, t, c, mode, focusSet) {
  worldTransform(g, c);
  if (mode !== 'focus') { drawDesk(g, c); drawThreads(g, t, c.z, true); }
  for (const [it, st] of visibleItems(t, c)) {
    const f = focusSet && focusSet.has(it);
    if ((mode === 'bg' && f) || (mode === 'focus' && !f)) continue;
    drawItem(g, it, st, t, c);
  }
  if (mode !== 'focus') drawThreads(g, t, c.z, false);
}
function drawSample(t) {
  const c = camAt(t), fa = focusAt(t);
  actx.setTransform(1, 0, 0, 1, 0, 0); actx.globalAlpha = 1; actx.globalCompositeOperation = 'source-over';
  if (fa.amt > .03) {
    const fs = new Set(fa.items);
    bgx.setTransform(1, 0, 0, 1, 0, 0); bgx.clearRect(0, 0, W, H); drawWorld(bgx, t, c, 'bg', fs);
    hx.setTransform(1, 0, 0, 1, 0, 0); hx.filter = `blur(${(fa.amt * 7).toFixed(2)}px)`; hx.drawImage(BG, 0, 0, W / 2, H / 2); hx.filter = 'none';
    actx.drawImage(HALF, 0, 0, W, H);
    drawWorld(actx, t, c, 'focus', fs);
  } else drawWorld(actx, t, c, 'all', null);
  drawFG(actx, t, c);
}
function samplesAt(t) {
  let n = Math.min(8, 1 + Math.ceil(camSpeed(t) / 7));
  for (const [a, b, k] of FAST) if (t >= a && t <= b) n = Math.max(n, k);
  return n;
}
function urlsAt(t) {
  const c = camAt(t), u = new Set();
  for (const [it, st] of visibleItems(t, c)) { const s = srcUrl(it.src, t); if (s) u.add(s); if (it.srcs) for (const x of it.srcs(t)) { const v = srcUrl(x, t); if (v) u.add(v); } }
  return u;
}
function post(t) {
  const zb = fxAt('zoomblur', t), faint = fxAt('faint', t);
  if (zb > .01) {   // radial zoom accent: stacked scaled copies
    px.setTransform(1, 0, 0, 1, 0, 0); px.globalAlpha = 1; px.drawImage(out.canvas, 0, 0);
    for (let k = 1; k <= 5; k++) { const s = 1 + zb * .035 * k; out.globalAlpha = .22; out.drawImage(POST, W / 2 - W * s / 2, H / 2 - H * s / 2, W * s, H * s); }
    out.globalAlpha = 1;
  }
  if (faint > .01) {
    px.setTransform(1, 0, 0, 1, 0, 0); px.filter = `blur(${(faint * 9).toFixed(1)}px)`; px.drawImage(out.canvas, 0, 0); px.filter = 'none';
    out.drawImage(POST, 0, 0); out.fillStyle = `rgba(5,3,2,${faint * .55})`; out.fillRect(0, 0, W, H);
    const v = out.createRadialGradient(W / 2, H / 2, H * (.55 - faint * .3), W / 2, H / 2, H * .95); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${faint * .85})`); out.fillStyle = v; out.fillRect(0, 0, W, H);
  }
  out.save(); out.globalCompositeOperation = 'soft-light'; out.fillStyle = 'rgba(90,140,130,.16)'; out.fillRect(0, 0, W, H); out.restore();
  for (const ov of OVERLAYS) ov(out, t);
  vignette(out, .82); applyGrain(out, t, .11);
  const fo = Math.max(prog(t, T_END - FADE_OUT, T_END), 1 - prog(t, T_START, T_START + FADE_IN)); if (fo > 0) { out.fillStyle = `rgba(0,0,0,${fo})`; out.fillRect(0, 0, W, H); }
}
window.renderAt = async t => {
  const S = samplesAt(t), shutter = .5 / 60, times = [];
  for (let k = 0; k < S; k++) times.push(Math.max(T_START, t - shutter * k / S));
  const urls = new Set(); for (const tt of times) for (const u of urlsAt(tt)) urls.add(u);
  await Promise.all([...urls].map(need));
  out.setTransform(1, 0, 0, 1, 0, 0); out.clearRect(0, 0, W, H);
  times.forEach((tt, k) => { drawSample(tt); out.globalAlpha = 1 / (k + 1); out.drawImage(ACC, 0, 0); });
  out.globalAlpha = 1; post(t);
  return S;
};
(async () => {
  await Promise.all([`800 66px ${SANS}`, `700 56px ${MONO}`, `400 30px ${MONO}`, `800 40px ${SANS}`].map(f => document.fonts.load(f)));
  makeGrain(); buildSprites(); WOODPAT = actx.createPattern(WOOD, 'repeat'); WOODPAT.setTransform(new DOMMatrix().scale(1.6));
  buildScenes(); checkCam();
  const r = rng(3); for (let i = 0; i < 140; i++) DUST.push({ x: -5000 + r() * 14000, y: -2500 + r() * 8000, p: 1.15 + r() * .9, r: 3 + r() * 9, a: .05 + r() * .18, v: .2 + r() * .5, ph: r() * 6 });
  await Promise.all(MEDIA.stills.map(k => need(stillUrl(k))));
  window.ready = true;
})();
</script></body></html>
